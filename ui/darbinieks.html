<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesniegumu saraksts · darbiniekam</title>
  <style>
    :root { --navy: #1D3557; --teal: #2A9D8F; --bg: #F1F3F5; --line: #C9CED6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    label { display: block; font-weight: 600; }
    input, select { padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; }
    button { padding: 9px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #e8ecf1; }
    .count { margin-top: 12px; color: #444; }
    .extend { margin-top: 24px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .extend h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .extend .fields { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .extend textarea { width: 100%; min-height: 64px; padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; }
    .result { margin-top: 12px; }
    .result.error { color: #9B1C1C; }
    .result.ok { color: #1B5E20; }
    tbody tr { cursor: pointer; }
  </style>
</head>
<body>
  <header><h1>Ezermalas novada pašvaldība · Iesniegumu saraksts</h1></header>
  <main>
    <form class="filters" id="filters">
      <div>
        <label for="status">Statuss</label>
        <select id="status" name="status">
          <option value="">Visi</option>
          <option value="RECEIVED">Saņemts</option>
          <option value="IN_PROGRESS">Izskatīšanā</option>
          <option value="FORWARDED">Pārsūtīts</option>
          <option value="ANSWERED">Atbildēts</option>
          <option value="WITHDRAWN">Atsaukts</option>
        </select>
      </div>
      <div>
        <label for="topic">Tēma</label>
        <select id="topic" name="topic">
          <option value="">Visas</option>
          <option value="ROADS">Ceļi un ielas</option>
          <option value="WASTE">Atkritumi</option>
          <option value="PLANNING">Teritorijas plānošana</option>
          <option value="PARKS">Parki un skvēri</option>
          <option value="OTHER">Cits</option>
        </select>
      </div>
      <button type="submit">Meklēt</button>
    </form>
    <div class="count" id="count"></div>
    <table>
      <thead>
        <tr><th>Numurs</th><th>Statuss</th><th>Tēma</th><th>Saņemts</th><th>Termiņš</th><th>Kanāls</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <!-- CR-C: termiņa pagarināšana. Validāciju dara API, forma tikai parāda atbildi. -->
    <form class="extend" id="extend" novalidate>
      <h2>Pagarināt termiņu</h2>
      <div class="fields">
        <div>
          <label for="extend-id">Iesnieguma numurs</label>
          <input id="extend-id" name="id" placeholder="IES-2026-000001">
        </div>
        <div>
          <label for="extend-date">Jaunais termiņš</label>
          <input id="extend-date" name="newDueDate" type="date">
        </div>
      </div>
      <div style="margin-top: 12px;">
        <label for="extend-reason">Iemesls (iedzīvotājs to redzēs paziņojumā)</label>
        <textarea id="extend-reason" name="reason"></textarea>
      </div>
      <div style="margin-top: 12px;"><button type="submit">Pagarināt</button></div>
      <div class="result" id="extend-result" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const rows = document.getElementById("rows");
    const count = document.getElementById("count");

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text == null ? "" : text;
      return td;
    }

    async function load(event) {
      if (event) event.preventDefault();
      const params = new URLSearchParams();
      const status = document.getElementById("status").value;
      const topic = document.getElementById("topic").value;
      if (status) params.set("status", status);
      if (topic) params.set("topic", topic);
      const response = await fetch("/submissions?" + params.toString());
      const data = await response.json();
      rows.innerHTML = "";
      if (!Array.isArray(data)) {
        count.textContent = "Kļūda: " + JSON.stringify(data);
        return;
      }
      count.textContent = "Atrasti: " + data.length;
      for (const s of data) {
        const tr = document.createElement("tr");
        [s.id, s.status, s.topic, s.receivedAt.slice(0, 10), s.dueDate, s.replyChannel]
          .forEach((value) => tr.appendChild(cell(value)));
        tr.addEventListener("click", () => {
          document.getElementById("extend-id").value = s.id;
        });
        rows.appendChild(tr);
      }
    }

    const extendResult = document.getElementById("extend-result");

    function showError(status, body) {
      const error = body && body.error;
      let text = "Kļūda: " + (error ? error.code + " · " + error.message : "HTTP " + status);
      if (error && Array.isArray(error.details)) {
        text += " (" + error.details.map((d) => d.field + ": " + d.issue).join(", ") + ")";
      }
      extendResult.className = "result error";
      extendResult.textContent = text;
    }

    async function extend(event) {
      event.preventDefault();
      const id = document.getElementById("extend-id").value.trim();
      const payload = {
        newDueDate: document.getElementById("extend-date").value,
        reason: document.getElementById("extend-reason").value,
      };
      const response = await fetch("/submissions/" + encodeURIComponent(id) + "/extend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        showError(response.status, body);
        return;
      }
      extendResult.className = "result ok";
      extendResult.textContent = "Termiņš pagarināts: " + body.id + " līdz " + body.dueDate;
      load();
    }

    document.getElementById("filters").addEventListener("submit", load);
    document.getElementById("extend").addEventListener("submit", extend);
    load();
  </script>
</body>
</html>
